[frame generation]
# 内容帧率低于门槛时按倍数补帧（30 → 60）
fg = true
fg-quality = high
fg-multiplier = 2
fg-threshold = 60
content-rates = 60,30

[super resolution / HDR]
# HDR 需要 Windows 开启 HDR
sr = true
sr-quality = hb-ultra
hdr = false

[pacing / display]
# vrr 需要显示器开启 G-SYNC / VRR；auto 自动探测
mode = vrr

[logging / measurement]
report = 10
