[frame generation]
# none | blend | nvof | vfx (Recommended)
interp = vfx

# low | medium | high
fg-quality = high

# 2: 60→120, 30→60。
fg-multiplier = 2
# 目标输出帧率（只在 mode = vrr 时生效）：60 = 30 帧游戏补到 60，60 帧菜单不补帧。0 = 按上面的倍数。
fg-target-fps = 60

fg-adaptive = true

[super resolution / HDR]
# none | rtx | vfx
sr = vfx

# VFX Settings:
# low | medium | high | ultra
# hb-low | hb-medium | hb-high | hb-ultra
# streaming-medium | streaming-ultra
sr-quality = hb-ultra

# none | rtx | vfx
hdr = none

[audio]
audio = true
audio-volume = 100
audio-sync = true
audio-device =
audio-out =

[pacing / display]
# vrr：按内容帧率出帧（需要显示器开 G-SYNC / VRR）；auto：自动探测；fixed：每个 vblank 出一帧
mode = vrr
monitor = 0
windowed = false

[logging / measurement]
# debug | info | warn | error
log-level = info
report = 10
report-detail = false
