# camss 配置文件
#
# 写法：每行 "选项 = 值"，选项名就是命令行参数去掉前面的 "--"（例如 --fg-quality medium 写成 fg-quality = medium）。
# 开关类选项写 true / false（也可以写 on/off、yes/no、1/0）。# 或 ; 开头的行是注释，[分组] 只是为了好看，不影响含义。
# 查找顺序：--config 指定的文件 > 当前目录的 camss.ini > camss.exe 所在目录的 camss.ini。
# 命令行参数优先于这里的设置；--no-config 完全不读配置文件；--print-config 打印最终生效的全部设置（可以直接复制回这里）。

[frame generation]
# 补帧：none | blend | nvof | vfx（vfx = NVIDIA Maxine Video Frame Generation，推荐）
interp = vfx
# 补帧档位：low | medium | high（越高越清楚，GPU 耗时 1.1 / 2.5 / 6.9 ms）。运行中按 F 循环切换。
fg-quality = low
# 补帧倍数（VRR 下）：内容帧率 × 倍数 = 输出帧率。2 表示 60→120、30→60。
fg-multiplier = 2
# 也可以指定目标输出帧率，程序自动选倍数（例如 120：60 帧内容 ×2，30 帧内容 ×4）。0 = 不用，按上面的倍数。
fg-target-fps = 0
# 自适应：识别信号里的重复帧（例如 60 Hz 信号里跑 30 帧的游戏），按真实内容帧补帧。
fg-adaptive = true

[super resolution / HDR]
# 超分：none | rtx | vfx（vfx = Maxine VideoSuperRes，rtx = 显卡驱动的 RTX VSR）
sr = vfx
# 超分档位（Maxine）：low | medium | high | ultra（标准）
#                    hb-low | hb-medium | hb-high | hb-ultra（适合无损/高码率的干净信号）
#                    streaming-medium | streaming-ultra（默认 streaming-medium）
# 运行中按 Q 在同一组里循环切换。
sr-quality = streaming-medium
# SDR→HDR：none | rtx | vfx。需要先在 Windows 显示设置里打开"使用 HDR"，否则只能看到色调映射后的预览。
hdr = none

[audio]
# 默认监听采集卡 HDMI 信号里的声音，从系统默认输出设备播放。运行中 M 静音，+ / - 调音量。
audio = true
# 音量 0~200（百分比）
audio-volume = 100
# 自动给声音加延迟，让声音和画面对齐
audio-sync = true
# 指定声音来源 / 输出设备（名字里的一段即可，--list 可以看到全部设备）。留空 = 自动。
audio-device =
audio-out =

[pacing / display]
# auto：自动探测显示器是否支持 VRR（G-SYNC / FreeSync），然后选 vrr 或 fixed
mode = auto
monitor = 0
windowed = false

[logging / measurement]
# 日志级别：debug | info | warn | error
log-level = info
# 状态行间隔（秒），0 = 不输出
report = 2
# 每次都输出完整的分段耗时表（平时按 L 输出一次即可）
report-detail = false
